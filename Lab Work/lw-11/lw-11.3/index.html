<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram UI</title>

    <link rel="stylesheet" href="asset/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">Instagram</div>

        <div class="search">
            <span>Search</span>
        </div>

        <div class="header-right">
            <button>+ Create a post</button>
            <span class="bell">♧</span>
        </div>
    </header>


    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="menu active">🏠 <span>Home</span></div>
        <div class="menu">🔍 <span>Search</span></div>
        <div class="menu">🌐 <span>Explore</span></div>
        <div class="menu">🎬 <span>Reels</span></div>
        <div class="menu">💬 <span>Messages</span></div>
        <div class="menu">❤️ <span>Notifications</span></div>
        <div class="menu">➕ <span>Create</span></div>
        <div class="menu">📊 <span>Dashboard</span></div>
        <div class="menu">👤 <span>Profile</span></div>

    </aside>


    <!-- MAIN CONTENT -->
    <main>

        <!-- STORIES -->
        <div class="stories">

            <div class="story">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=200&q=80">
            </div>

            <div class="story">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=200&q=80">
            </div>

            <div class="story">
                <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=200&q=80">
            </div>

            <div class="story">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=200&q=80">
            </div>

            <div class="story">
                <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=200&q=80">
            </div>

            <div class="story">
                <img src="https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?auto=format&fit=crop&w=200&q=80">
            </div>

        </div>


        <!-- POST 1 -->
        <div class="post">

            <div class="post-header">
                <b>@instantbollywood</b>
                <span>• 9m</span>
            </div>

            <img class="post-image"
                 src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=900&q=80">

        </div>


        <!-- POST 2 -->
        <div class="post">

            <div class="post-header">
                <b>@dailyhnews</b>
                <span>• 15m</span>
            </div>

            <img class="post-image"
                 src="https://images.unsplash.com/photo-1518391846015-55a9cc003b25?auto=format&fit=crop&w=900&q=80">

        </div>

    </main>

</body>
</html>
